name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'build_windows.bat'
      - '.github/workflows/windows-build.yml'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Compile check
        run: python -m compileall app.py zeroai
      - name: Core tests
        run: python -m unittest discover -s tests -v
      - name: Build portable app
        run: pyinstaller --noconfirm --clean --windowed --name ZeroAI app.py
      - name: Create portable ZIP
        shell: powershell
        run: Compress-Archive -Path 'dist\ZeroAI\*' -DestinationPath 'dist\ZeroAI-Windows-x64.zip' -Force
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ZeroAI-Windows-x64
          path: dist/ZeroAI-Windows-x64.zip
          if-no-files-found: error
